name: Narrative collection (6-hourly)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days to backfill (0 = normal run)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Collect official statements
        env:
          DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: |
          if [[ "$DAYS" =~ ^[0-9]+$ ]] && [ "$DAYS" -gt 0 ]; then
            python scripts/narratives.py collect --backfill-days "$DAYS"
          else
            python scripts/narratives.py collect
          fi
      - name: Commit
        run: |
          git config user.name  "weekly-osint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narratives
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Narrative collection $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
