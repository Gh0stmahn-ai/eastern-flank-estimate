name: Daily indicators

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC, after the Central Bank of Russia publishes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # start from the newest commit, not the one current when the job was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Central Bank of Russia rates
        run: python scripts/gray.py daily
      - name: Commit
        run: |
          git config user.name  "weekly-osint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gray
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Daily indicators $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
