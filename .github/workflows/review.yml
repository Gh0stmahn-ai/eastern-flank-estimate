name: Apply review decisions

on:
  issues:
    types: [edited, closed]

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply:
    # only the repository owner's ticks count
    if: contains(github.event.issue.labels.*.name, 'review-queue') && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # start from the newest commit, not the one current when the job was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Record approvals and rejections
        env:
          BODY: ${{ github.event.issue.body }}
          ACTION: ${{ github.event.action }}
        run: |
          printf '%s' "$BODY" > /tmp/issue_body.md
          if [ "$ACTION" = "closed" ]; then
            python scripts/narratives.py apply-review /tmp/issue_body.md --closing
            python scripts/gray.py apply-review /tmp/issue_body.md --closing
          else
            python scripts/narratives.py apply-review /tmp/issue_body.md
            python scripts/gray.py apply-review /tmp/issue_body.md
          fi
          python scripts/narratives.py weekly
      - name: Commit
        run: |
          git config user.name  "weekly-osint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/narratives data/gray
          if git diff --cached --quiet; then echo "No decisions changed."; exit 0; fi
          git commit -m "Review decisions applied"
          git pull --rebase
          git push
