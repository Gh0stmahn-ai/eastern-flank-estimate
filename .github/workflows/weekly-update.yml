name: Weekly OSINT refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Refresh war data
        run: python scripts/update.py
      - name: Narratives, fill any gaps from the last 30 days
        run: python scripts/narratives.py collect --backfill-days 30
      - name: Narratives, weekly analysis
        run: python scripts/narratives.py weekly
      - name: Gray-zone indicators (Oryx, sanctioned vessels, reporting monitor)
        run: python scripts/gray.py weekly
      - name: Commit
        run: |
          git config user.name  "weekly-osint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CHANGELOG.md
          if git diff --cached --quiet; then echo "No changes this week."; else
            git commit -m "Weekly OSINT refresh $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      - name: Open this week's review queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create review-queue --color FBCA04 --description "Weekly narrative quote review" --force
          cat data/narratives/review_issue.md data/gray/review_section.md > /tmp/review.md
          if grep -q '^- \[ \]' /tmp/review.md; then
            gh issue create --title "Review queue: week of $(date -u +%Y-%m-%d)" \
              --label review-queue --body-file /tmp/review.md
          else
            echo "Nothing to review this week."
          fi
